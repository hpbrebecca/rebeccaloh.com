                const currentSection = section || 'aboutme';
                const sectionTitles = titleTranslations[currentSection] || titleTranslations.aboutme;

                const twitterTitle = document.querySelector('meta[name="twitter:title"]');
                if (ogTitle) ogTitle.setAttribute('content', title);
                if (twitterTitle) twitterTitle.setAttribute('content', title);

                const metaDescription = document.querySelector('meta[name="description"]');
                const ogDescription = document.querySelector('meta[property="og:description"]');
                const twitterDescription = document.querySelector('meta[name="twitter:description"]');
                const description = descriptionTranslations[lang] || descriptionTranslations.en;
                
                if (metaDescription) metaDescription.setAttribute('content', description);
                if (ogDescription) ogDescription.setAttribute('content', description);
                if (twitterDescription) twitterDescription.setAttribute('content', description);
            }

            window.updatePageTitle = updatePageTitle;

                    de: "Rebecca Loh, Zürich, Schweiz",

            const h2Translations = {
                aboutme: {
                    en: "About Me",
                    de: "Über mich",
                    fr: "À propos de moi",
                    zh: "關於我"
                },
                connect: {
                    en: "Connect",
                    de: "Vernetzen",
                    fr: "Se connecter",
                    zh: "探索"
                },
                quotes: {
                    en: "Quotes",

                const currentSection = section || 'aboutme';

                const quotesHeading = document.getElementById('quotesHeading');

            // ... (+4 each line)
            // until the peak, then mirror back down in steps of 4.
            function buildWordPyramidLines(words) {
                const N = words.length;
                if (N <= 0) return [];
                if (N <= 6) return [words.join(' ')];

                const base = 6;
                const step = 4;
                const maxLines = 80; // safety guard

                // Build ascending counts: 6, 10, 14, 18, ... until capacity fits
                const asc = [];
                let sumAsc = 0;
                for (let i = 0; i < maxLines; i++) {
                    const c = base + (i * step);
                    asc.push(c);
                    sumAsc += c;
                    const peak = c;
                    const capacity = (2 * sumAsc) - peak; // mirror without double-counting peak
                    if (capacity >= N) break;
                }

                // Mirror down: ..., 18, 14, 10, 6
                const counts = asc.concat(asc.slice(0, -1).reverse());

                // Build line strings
                const lines = [];
                let cursor = 0;
                for (const c of counts) {
                    if (cursor >= N) break;
                    const take = Math.min(c, N - cursor);
                    lines.push(words.slice(cursor, cursor + take).join(' '));
                    cursor += take;
                }
                return lines;
            }

            // Layout text into a circle silhouette based on LINE HEIGHT.
            // "cm" is implemented as CSS-cm equivalent: 1cm = 96/2.54 CSS pixels (web standard),
            // then we quantize per-line widths to cm steps (2cm, 4cm, 6cm, 7cm, ...) by rounding.
            const _circleMeasureCanvas = document.createElement('canvas');
            const _circleMeasureCtx = _circleMeasureCanvas.getContext('2d');
            const _PX_PER_CM = 96 / 2.54;

            function _setCanvasFontFrom(el) {
                const cs = window.getComputedStyle(el);
                const fontStyle = cs.fontStyle || 'normal';
                const fontWeight = cs.fontWeight || '400';
                const fontSize = cs.fontSize || '16px';
                const fontFamily = cs.fontFamily || 'sans-serif';
                _circleMeasureCtx.font = `${fontStyle} ${fontWeight} ${fontSize} ${fontFamily}`;
            }

            function _measureTextPx(text, el) {
                if (!_circleMeasureCtx) return text.length * 8;
                _setCanvasFontFrom(el);
                return _circleMeasureCtx.measureText(text).width;
            }

            function applyCircleSilhouette(circleContent) {
                const paragraphs = Array.from(circleContent.querySelectorAll('.circle-paragraph'));
                if (!paragraphs.length) return;

                // Collect paragraph texts (preserve paragraph boundaries)
                const paraWords = paragraphs.map(p => ({
                    el: p,
                    original: (p.dataset.originalText ?? p.textContent ?? '').trim(),
                    words: (p.dataset.originalText ?? p.textContent ?? '').trim().split(/\s+/).filter(Boolean)
                }));
                if (!paraWords.some(p => p.words.length)) return;

                const circle = circleContent.closest('.about-circle');
                if (!circle) return;

                const r = Math.max(0, Math.min(circle.clientWidth, circle.clientHeight) / 2);
                const sampleEl = paraWords[0].el;
                const cs = window.getComputedStyle(sampleEl);
                const fontSizePx = parseFloat(cs.fontSize) || 16;
                const lineHeightPx = parseFloat(cs.lineHeight) || (fontSizePx * 1.35);
                const maxLines = Math.max(1, Math.floor((2 * r) / lineHeightPx));

                // Precompute circle widths and quantize them to cm steps.
                const rawWidthsPx = [];
                const roundedWidthsPx = [];
                const roundedWidthsCm = [];
                for (let i = 0; i < maxLines; i++) {
                    const y = (i - (maxLines - 1) / 2) * lineHeightPx;
                    const w = 2 * Math.sqrt(Math.max(0, (r * r) - (y * y)));
                    rawWidthsPx.push(w);
                    const cm = Math.max(0, w / _PX_PER_CM);
                    const cmRounded = Math.max(0, Math.round(cm));
                    roundedWidthsCm.push(cmRounded);
                    roundedWidthsPx.push(Math.min(w, cmRounded * _PX_PER_CM));
                }

                // Choose start/end so the first/last visible line is ~2cm (requested),
                // but never exceed the computed circle.
                const minStartCm = 2;
                let startIdx = 0;
                while (startIdx < maxLines && roundedWidthsCm[startIdx] < minStartCm) startIdx++;
                let endIdx = maxLines - 1;
                while (endIdx > startIdx && roundedWidthsCm[endIdx] < minStartCm) endIdx--;

                // Enforce monotonic increase to the middle, then decrease (in cm steps)
                const midIdx = Math.floor((startIdx + endIdx) / 2);
                for (let i = startIdx + 1; i <= midIdx; i++) {
                    if (roundedWidthsCm[i] < roundedWidthsCm[i - 1]) roundedWidthsCm[i] = roundedWidthsCm[i - 1];
                }
                for (let i = endIdx - 1; i > midIdx; i--) {
                    if (roundedWidthsCm[i] < roundedWidthsCm[i + 1]) roundedWidthsCm[i] = roundedWidthsCm[i + 1];
                }
                // Mirror to keep symmetry
                for (let i = 0; i <= (endIdx - startIdx); i++) {
                    const a = startIdx + i;
                    const b = endIdx - i;
                    const v = Math.min(roundedWidthsCm[a], roundedWidthsCm[b]);
                    roundedWidthsCm[a] = v;
                    roundedWidthsCm[b] = v;
                }

                // Convert to px and clamp to raw circle widths
                for (let i = startIdx; i <= endIdx; i++) {
                    roundedWidthsPx[i] = Math.min(rawWidthsPx[i], roundedWidthsCm[i] * _PX_PER_CM);
                }

                // Clear paragraphs
                paraWords.forEach(p => { p.el.innerHTML = ''; });

                let pIndex = 0;
                let wi = 0;
                let currentWords = paraWords[pIndex].words;
                let currentEl = paraWords[pIndex].el;

                // Insert one "blank line" between paragraphs to visually show paragraph break
                let pendingParaBreak = false;

                for (let li = startIdx; li <= endIdx && pIndex < paraWords.length; li++) {
                    const w = roundedWidthsPx[li];

                    if (pendingParaBreak) {
                        const br = document.createElement('span');
                        br.className = 'circle-line circle-line-break';
                        br.textContent = '';
                        br.style.width = `${Math.max(0, w)}px`;
                        br.style.maxWidth = `${Math.max(0, w)}px`;
                        currentEl.appendChild(br);
                        pendingParaBreak = false;
                        continue;
                    }

                    // If current paragraph done, move to next
                    while (pIndex < paraWords.length && wi >= currentWords.length) {
                        pIndex++;
                        if (pIndex >= paraWords.length) break;
                        currentWords = paraWords[pIndex].words;
                        wi = 0;
                        currentEl = paraWords[pIndex].el;
                        // add a blank line before new paragraph (counted in circle)
                        pendingParaBreak = true;
                    }
                    if (pIndex >= paraWords.length) break;

                    let line = '';
                    while (wi < currentWords.length) {
                        const candidate = line ? `${line} ${currentWords[wi]}` : currentWords[wi];
                        if (line && _measureTextPx(candidate, currentEl) > w) break;
                        line = candidate;
                        wi++;
                        if (_measureTextPx(line, currentEl) > w) break;
                    }
                    if (!line && wi < currentWords.length) {
                        line = currentWords[wi];
                        wi++;
                    }

                    const span = document.createElement('span');
                    span.className = 'circle-line';
                    span.textContent = line;
                    // FIXED width so spacing can stretch to fit (circle silhouette)
                    span.style.width = `${Math.max(0, w)}px`;
                    span.style.maxWidth = `${Math.max(0, w)}px`;

                    // If this is the last line of a paragraph (or we run out of words), don't justify it
                    const isLastInParagraph = (wi >= currentWords.length);
                    if (isLastInParagraph) {
                        span.classList.add('is-last');
                    }

                    currentEl.appendChild(span);
                }
            }

            function restoreCircleSilhouette(circleContent) {
                const paragraphs = Array.from(circleContent.querySelectorAll('.circle-paragraph'));
                paragraphs.forEach(p => {
                    const original = (p.dataset.originalText ?? '').trim();
                    p.textContent = original || p.textContent;
                });
            }
            
            function buildDetails(accordion, entries) {
                accordion.innerHTML = '';

                // Restore "lines/accordion" version: titles in rows, content expands underneath.
                (entries || []).forEach((entry) => {
                    const details = document.createElement('details');
                    details.className = 'about-detail';

                    const summary = document.createElement('summary');
                    summary.className = 'about-detail-summary';
                    summary.textContent = entry.title || '';

                    const body = document.createElement('div');
                    body.className = 'about-detail-body';
                    (entry.paragraphs || [])
                        .map(t => (t || '').trim())
                        .filter(Boolean)
                        .forEach((t) => {
                            const p = document.createElement('p');
                            p.textContent = t;
                            body.appendChild(p);
                        });

                    details.appendChild(summary);
                    details.appendChild(body);

                    // Optional: only one open at a time
                    details.addEventListener('toggle', () => {
                        if (!details.open) return;
                        accordion.querySelectorAll('details.about-detail[open]').forEach((d) => {
                            if (d !== details) d.open = false;
                        });
                    });

                    accordion.appendChild(details);
                });
            }

            function buildRecommendations(list, services) {
                list.innerHTML = '';
                if (!services.length) {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'recommendation-card';
                    placeholder.textContent = 'Details coming soon.';
                    list.appendChild(placeholder);
                    return;
                }

                services.forEach(service => {
                    const card = document.createElement('div');
                    card.className = 'recommendation-card';

                    const label = document.createElement('span');
                    label.className = 'service-label';
                    label.textContent = service.label;

                    const link = document.createElement('a');
                    link.className = 'service-link';
                    link.href = service.href || '#';
                    link.textContent = service.linkText;
                    link.setAttribute('aria-label', service.label);

                    card.appendChild(label);
                    card.appendChild(link);
                    list.appendChild(card);
                });
            }

            function updateAboutContent(lang) {
                const language = lang || 'en';

                if (connectDescription && aboutContent.description) {
                    connectDescription.textContent = aboutContent.description[language] || aboutContent.description.en;
                }

                if (aboutIntro && aboutContent.intro) {
                    const introCopy = aboutContent.intro[language] || aboutContent.intro.en || '';
                    aboutIntro.textContent = introCopy;
                    aboutIntro.style.display = introCopy ? 'block' : 'none';
                }

                if (aboutAccordion) {
                    const entries = aboutContent.sections && (aboutContent.sections[language] || aboutContent.sections.en || []);
                    buildDetails(aboutAccordion, entries);
                }

                if (recommendationsGrid && aboutContent.recommendations && aboutContent.recommendations.services) {
                    const services = aboutContent.recommendations.services[language] || aboutContent.recommendations.services.en || [];
                    buildRecommendations(recommendationsGrid, services);
                }

                const disclaimerContent = aboutContent.recommendations && aboutContent.recommendations.disclaimer;
                if (disclaimerContent) {
                    const title = disclaimerContent.title ? (disclaimerContent.title[language] || disclaimerContent.title.en || 'Disclaimer') : 'Disclaimer';
                    const body = disclaimerContent.body ? (disclaimerContent.body[language] || disclaimerContent.body.en || '') : '';

                    if (disclaimerHeadingEl) {
                        disclaimerHeadingEl.textContent = title;
                    }

                    if (disclaimerCopyEl) {
                        disclaimerCopyEl.textContent = body;
                    }

                    if (disclaimerMiniEl) {
                        disclaimerMiniEl.textContent = title;
                        disclaimerMiniEl.setAttribute('aria-expanded', 'false');
                    }
                }
            }

            window.updateAboutContent = updateAboutContent;

            const sections = {
                connect: { element: connectSection, display: 'flex' },
                aboutme: { element: aboutmeSection, display: 'flex' },
                quotes: { element: quotesSection, display: 'flex' },
                recommendations: { element: recommendationsSection, display: 'flex' },
                disclaimer: { element: disclaimerSection, display: 'flex' }
            };

            function showSection(section) {
                const target = sections[section] ? section : 'aboutme';
                const currentLang = getCurrentLanguage();

                // Hide all sections first
                Object.entries(sections).forEach(([key, value]) => {
                    if (value.element) {
                        value.element.style.display = 'none';
                    }
                });

                // Show the target section
                if (sections[target] && sections[target].element) {
                    sections[target].element.style.display = sections[target].display;
                }

                // Update page title and H2 when section changes
                updatePageTitle(currentLang, target);
                updateH2(currentLang, target);

                const container = document.querySelector('.main-content-designer');
                if (container) {
                    container.scrollTop = 0;
                    const needsScroll = target === 'aboutme' || target === 'disclaimer' || target === 'connect';
                    container.classList.toggle('scrollable', needsScroll);
                }

                if (target === 'quotes') {
                    if (window.currentQuoteElement) {
                        window.currentQuoteElement.style.display = 'block';
                    } else if (typeof window.showNextQuote === 'function') {
                        window.showNextQuote();
                    }
                } else {
                    if (window.currentQuoteTimeout) {
                        clearTimeout(window.currentQuoteTimeout);
                        window.currentQuoteTimeout = null;
                    }
                    if (window.currentQuoteElement) {
                        window.currentQuoteElement.style.display = 'none';
                    }
                }
            }

            if (disclaimerMiniEl) {
                disclaimerMiniEl.addEventListener('click', () => {
                    navLinks.forEach(nl => nl.classList.remove('active'));
                    showSection('disclaimer');
                    disclaimerMiniEl.setAttribute('aria-expanded', 'true');
                });
            }

            const initialLang = getCurrentLanguage();
            updateAboutContent(initialLang);
            updatePageTitle(initialLang, 'aboutme');
            updateH1(initialLang);
            updateH2(initialLang, 'aboutme');
            
            // Handle URL routing
            function handleRouting() {
                // Check if we have a redirect parameter from 404.html
                const urlParams = new URLSearchParams(window.location.search);
                const redirectPath = urlParams.get('redirect');
                
                if (redirectPath) {
                    // Restore the original URL from the redirect parameter
                    // This happens when someone directly accesses a URL like /en/aboutme
                    window.history.replaceState(null, '', redirectPath);
                    // Remove the redirect parameter from the URL
                    urlParams.delete('redirect');
                    const newSearch = urlParams.toString();
                    const newUrl = redirectPath + (newSearch ? '?' + newSearch : '');
                    window.history.replaceState(null, '', newUrl);
                }
                
                const path = window.location.pathname;
                const hash = window.location.hash.replace('#', '');
                
                // Extract language from URL (e.g., /en/aboutme, /de/connect)
                const langMatch = path.match(/^\/(en|de|fr|zh)(\/|$)/);
                let currentLang = langMatch ? langMatch[1] : 'en';
                
                // Extract section from URL
                let targetSection = 'aboutme'; // default
                
                // Check for language-prefixed paths
                if (langMatch) {
                    const sectionMatch = path.match(/^\/(en|de|fr|zh)\/(aboutme|connect|quotes|recommendations)/);
                    if (sectionMatch) {
                        targetSection = sectionMatch[2];
                    } else if (path.match(/^\/(en|de|fr|zh)\/?$/)) {
                        targetSection = 'aboutme'; // default section for language root
                    }
                } else {
                    // Fallback: check for old-style paths without language
                    if (path === '/aboutme' || path === '/aboutme/' || path.endsWith('/aboutme.html') || hash === 'aboutme') {
                        targetSection = 'aboutme';
                        // Redirect to language-prefixed URL
                        currentLang = getCurrentLanguage();
                        updateURLWithLanguage(currentLang, targetSection);
                    } else if (path === '/connect' || path === '/connect/' || path.endsWith('/connect.html') || hash === 'connect') {
                        targetSection = 'connect';
                        currentLang = getCurrentLanguage();
                        updateURLWithLanguage(currentLang, targetSection);
                    } else if (path === '/quotes' || path === '/quotes/' || path.endsWith('/quotes.html') || hash === 'quotes') {
                        targetSection = 'quotes';
                        currentLang = getCurrentLanguage();
                        updateURLWithLanguage(currentLang, targetSection);
                    } else if (path === '/recommendations' || path === '/recommendations/' || path.endsWith('/recommendations.html') || hash === 'recommendations') {
                        targetSection = 'recommendations';
                        currentLang = getCurrentLanguage();
                        updateURLWithLanguage(currentLang, targetSection);
                    } else if (path === '/' || path === '') {
                        // Root path: redirect to default language
                        currentLang = getCurrentLanguage();
                        updateURLWithLanguage(currentLang, 'aboutme');
                        targetSection = 'aboutme';
                    }
                }
                
                // Update language if changed
                if (window.currentLang !== currentLang) {
                    window.currentLang = currentLang;
                    if (window.updateLanguageDisplay) {
                        window.updateLanguageDisplay(currentLang);
                    }
                    updateAboutContent(currentLang);
                    updatePageTitle(currentLang, targetSection);
                    updateH1(currentLang);
                    updateH2(currentLang, targetSection);
                } else {
                    // Always update title and headings to ensure they're correct for current section
                    updatePageTitle(currentLang, targetSection);
                    updateH2(currentLang, targetSection);
                }
                
                // Update active nav link
                navLinks.forEach(nl => nl.classList.remove('active'));
                const activeLink = document.querySelector(`[data-section="${targetSection}"]`);
                if (activeLink) {
                    activeLink.classList.add('active');
                }
                
                showSection(targetSection);
            }
            
            // Handle initial load and hash changes
            handleRouting();
            window.addEventListener('popstate', handleRouting);
            
            // Also handle hash changes for direct navigation
            window.addEventListener('hashchange', () => {
                const hash = window.location.hash.replace('#', '');
                if (hash && ['aboutme', 'connect', 'quotes', 'recommendations'].includes(hash)) {
                    const currentLang = getCurrentLanguage();
                    updateURLWithLanguage(currentLang, hash);
                    handleRouting();
                }
            });
            
            // Update nav links to use proper URLs with language
            function updateNavLinks() {
                const currentLang = getCurrentLanguage();
                navLinks.forEach(navLink => {
                    const section = navLink.getAttribute('data-section');
                    if (section) {
                        navLink.setAttribute('href', `/${currentLang}/${section}`);
                    }
                });
            }
            
            // Expose globally for quotes.js
            window.updateNavLinks = updateNavLinks;
            
            // Initial update of nav links
            updateNavLinks();
            
            // Override nav link clicks to use pushState with language
            navLinks.forEach((navLink, index) => {
                navLink.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    const section = navLink.getAttribute('data-section') || 'aboutme';
                    const currentLang = getCurrentLanguage();
                    
                    // Show the section immediately - this is the most important part
                    showSection(section);
                    
                    // Update active state
                    navLinks.forEach(nl => {
                        nl.classList.remove('active');
                    });
                    navLink.classList.add('active');
                    
                    // Update URL without reload
                    updateURLWithLanguage(currentLang, section);
                    
                    // Update H1 and H2
                    updateH1(currentLang);
                    updateH2(currentLang, section);
                    
                    if (disclaimerMiniEl) {
                        disclaimerMiniEl.setAttribute('aria-expanded', 'false');
                    }
                    
                    return false;
                }, { passive: false });
            });

            window.handleLogoError = function handleLogoError(img) {
                const fallback = img.getAttribute('data-fallback');
                if (!fallback) {
                    return;
                }
                img.style.display = 'none';
                const fallbackDiv = document.createElement('div');
                fallbackDiv.className = 'logo-fallback';
                fallbackDiv.textContent = fallback.replace(' ', '\n');
                img.parentNode.insertBefore(fallbackDiv, img.nextSibling);
            };

            const LINKEDIN_WEB_URL = 'https://www.linkedin.com/in/rebiloh';
            const LINKEDIN_APP_URL = 'linkedin://in/rebiloh';

            function openLinkedInProfile(event) {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

                if (isMobile) {
                    const fallbackTimer = setTimeout(() => {
                        window.location.href = LINKEDIN_WEB_URL;
                    }, 700);

                    window.location.href = LINKEDIN_APP_URL;

                    setTimeout(() => {
                        clearTimeout(fallbackTimer);
                    }, 1500);
                } else {
                    window.open(LINKEDIN_WEB_URL, '_blank', 'noopener');
                }
            }

            const linkedinTargets = document.querySelectorAll('[data-linkedin="profile"]');
            linkedinTargets.forEach(target => {
                target.addEventListener('click', openLinkedInProfile);
                target.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        openLinkedInProfile(event);
                    }
                });
            });

            const audioPlayer = document.getElementById('backgroundMusicFuture');
            const audioBtn = document.getElementById('audioControlBtnFuture');

            if (audioPlayer && audioBtn) {
                // Ensure audio is muted and paused by default
                audioPlayer.muted = true;
                audioPlayer.pause();
                
                // Only start music when user explicitly clicks the button
                audioBtn.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    if (audioPlayer.paused) {
                        audioPlayer.muted = false;
                        const playPromise = audioPlayer.play();
                        if (playPromise) {
                            playPromise.then(() => {
                                audioBtn.classList.add('playing');
                            }).catch(() => {
                                audioPlayer.muted = true;
                                audioPlayer.pause();
                                audioBtn.classList.remove('playing');
                            });
                        } else {
                            audioBtn.classList.add('playing');
                        }
                    } else {
                        audioPlayer.pause();
                        audioPlayer.muted = true;
                        audioBtn.classList.remove('playing');
                    }
                });
            }
        });
    </script>
</body>
