<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Rezepte</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">Rezepte</h1>
            <button class="btn-primary" id="newRecipeBtn">
                <span>+</span> Neues Rezept
            </button>
        </div>
    </nav>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Rezepte durchsuchen...">
            </div>
            <div class="filter-section">
                <h3>Kategorien</h3>
                <div class="category-list" id="categoryList">
                    <button class="category-btn active" data-category="all">Alle</button>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="recipes-container" id="recipesContainer">
                <!-- Recipes will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Recipe Modal -->
    <div class="modal-overlay" id="recipeModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Neues Rezept</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <form id="recipeForm" class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Rezeptname *</label>
                        <input type="text" id="recipeName" required>
                    </div>
                    <div class="form-group">
                        <label>Bild (Dateiname oder URL)</label>
                        <input type="text" id="recipeImage" placeholder="z.B. Rezept1.jpg">
                    </div>
                </div>
                <div class="form-group">
                    <label>Kategorie</label>
                    <select id="recipeCategory">
                        <option value="Hauptgericht">Hauptgericht</option>
                        <option value="Vorspeise">Vorspeise</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Snack">Snack</option>
                        <option value="Getränk">Getränk</option>
                        <option value="Sonstiges">Sonstiges</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Beschreibung</label>
                    <textarea id="recipeDescription" rows="2"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Zubereitungszeit (Min)</label>
                        <input type="number" id="recipeTime" min="1">
                    </div>
                    <div class="form-group">
                        <label>Portionen</label>
                        <input type="number" id="recipeServings" min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label>Zutaten * (eine pro Zeile)</label>
                    <textarea id="recipeIngredients" rows="8" required></textarea>
                </div>
                <div class="form-group">
                    <label>Zubereitung * (ein Schritt pro Zeile)</label>
                    <textarea id="recipeInstructions" rows="10" required></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="cancelBtn">Abbrechen</button>
                    <button type="submit" class="btn-primary">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Recipe View Modal -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal modal-large">
            <div class="modal-header">
                <h2 id="viewRecipeName"></h2>
                <button class="close-btn" id="closeViewModal">&times;</button>
            </div>
            <div class="modal-body" id="viewRecipeContent">
                <!-- Recipe content will be loaded here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
