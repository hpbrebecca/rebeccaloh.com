<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Rezepte</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🍳 Meine Rezepte</h1>
            <button class="btn-add" id="addRecipeBtn">+ Neues Rezept</button>
        </div>
    </header>

    <main class="container">
        <div class="recipes-grid" id="recipesGrid">
            <!-- Recipes will be loaded here -->
        </div>
    </main>

    <!-- Add Recipe Modal -->
    <div class="modal" id="addRecipeModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Neues Rezept hinzufügen</h2>
            <form id="recipeForm">
                <div class="form-group">
                    <label for="recipeName">Rezeptname</label>
                    <input type="text" id="recipeName" required>
                </div>
                <div class="form-group">
                    <label for="recipeImage">Bild (URL oder Dateiname)</label>
                    <input type="text" id="recipeImage" placeholder="z.B. Rezept1.jpg" required>
                </div>
                <div class="form-group">
                    <label for="recipeDescription">Beschreibung</label>
                    <textarea id="recipeDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="recipeIngredients">Zutaten (eine pro Zeile)</label>
                    <textarea id="recipeIngredients" rows="6" required></textarea>
                </div>
                <div class="form-group">
                    <label for="recipeInstructions">Anleitung</label>
                    <textarea id="recipeInstructions" rows="8" required></textarea>
                </div>
                <div class="form-group">
                    <label for="recipeTime">Zubereitungszeit (Minuten)</label>
                    <input type="number" id="recipeTime" min="1">
                </div>
                <div class="form-group">
                    <label for="recipeServings">Portionen</label>
                    <input type="number" id="recipeServings" min="1">
                </div>
                <button type="submit" class="btn-submit">Rezept speichern</button>
            </form>
        </div>
    </div>

    <!-- Recipe Detail Modal -->
    <div class="modal" id="recipeDetailModal">
        <div class="modal-content modal-large">
            <span class="close" id="closeDetailModal">&times;</span>
            <div id="recipeDetailContent">
                <!-- Recipe details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
